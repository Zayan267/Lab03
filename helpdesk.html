<!DOCTYPE html>
<html lang="en">
    <head>
     <meta charset="utf-8" />
     <meta name="description" content="Demonstrates forms" />
     <meta name="keywords" content="HTML, Form, tags" />
     <meta name="author" content="Zayan"  />
     <title>CWA Help Desk Appointment</title>
    </head>
    <body>
        <img src="logo.png" alt="Swinburne Logo" width="220">
        <h1>CWA Help Desk Appointment</h1>
        <form action="http://mercury.swin.edu.au/it000000/formtest.php" method="post">
            <fieldset>
                <legend>Appointment Details</legend>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" placeholder="YYYY-MM-DD" required><br><br>
                <label for="issue">Issue Type:</label>
                <select id="issue" name="issue" required>
                    <option value="">Please Select</option>
                    <option value="network">Network</option>
                    <option value="hardware">Hardware</option>
                    <option value="software">Software</option>
                </select><br><br>

                <label for="description">Description:</label><br>
                    <textarea id="description" name="description" placeholder="Describe your issue..." required></textarea><br><br>
            </fieldset>
            
            <fieldset>
                <legend>Preferences</legend>
                <p>Preferred Contact Method:</p>
                <input type="radio" id="emailContact" name="contact" value="email" required>
                <label for="emailContact">Email</label>
                <input type="radio" id="phoneContact" name="contact" value="phone">
                <label for="phoneContact">Phone</label><br><br>
            
            <p>Additional Services:</p>
                <input type="checkbox" id="followup" name="services[]" value="followup" checked="checked">
                <label for="followup">Follow-up Call</label>
                <input type="checkbox" id="onsite" name="services[]" value="onsite">
                <label for="onsite">On-site Visit</label>
            </fieldset>
            <br>
            <input type="submit" value="Book Appointment">
        </form>
    
    </body>
</html>
